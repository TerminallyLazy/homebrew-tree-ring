name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Install upstream lint tools on Intel macOS
        if: matrix.os == 'macos-15-intel'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/shellcheck.tar.gz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.x86_64.tar.gz
          echo "c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51  $RUNNER_TEMP/shellcheck.tar.gz" | shasum --algorithm 256 --check
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          # test-bot prepends the Homebrew bin directory to PATH.
          install -m 755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$(brew --prefix)/bin/shellcheck"
          "$(brew --prefix)/bin/shellcheck" --version
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_amd64.tar.gz
          echo "5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644  $RUNNER_TEMP/actionlint.tar.gz" | shasum --algorithm 256 --check
          mkdir -p "$RUNNER_TEMP/tree-ring-actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/tree-ring-actionlint"
          install -m 755 "$RUNNER_TEMP/tree-ring-actionlint/actionlint" "$(brew --prefix)/bin/actionlint"
          "$(brew --prefix)/bin/actionlint" -version

      - run: brew test-bot --only-tap-syntax --verbose
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
